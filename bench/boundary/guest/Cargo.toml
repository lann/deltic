[package]
name = "boundary-bench-guest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async-spawn` backs `stream-source`'s background producer task (issue
# #68); the existing calls-per-second shapes only need plain `async`.
wit-bindgen = { version = "=0.60.0", features = ["async", "async-spawn"] }

[profile.release]
opt-level = "s"

# Standalone on purpose (not a workspace member): the bench guest builds
# for wasm32-wasip2 with its own lock, like the fixture guests.
[workspace]

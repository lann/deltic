[package]
name = "example-hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.60.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Standalone: opt out of the repository's root cargo workspace so this
# directory can be copied out of the repo and built as-is.
[workspace]

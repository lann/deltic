[package]
name = "guest-future-import"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async` (default) provides the guest-side task executor and stream/future
# support; no spawning here — `run-send` writes its stream from the same
# task, after the sync `send-sink` import returns (that ordering is the
# point of the probe).
wit-bindgen = { version = "=0.60.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Opt out of the repository's root cargo workspace.
[workspace]

[package]
name = "guest-resource-stream"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async` (default) provides the guest-side task executor and stream
# support; the streams here carry RESOURCES, not bytes — the point of the
# fixture (see wit/world.wit).
wit-bindgen = { version = "=0.60.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Opt out of the repository's root cargo workspace.
[workspace]

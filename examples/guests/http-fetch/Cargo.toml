[package]
name = "guest-http-fetch"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async` (default) provides the guest-side task executor and
# stream/future support; `async-spawn` backs the background writes into
# the trailers/res futures (futures are rendezvous: a write only completes
# once the host reads it).
wit-bindgen = { version = "=0.60.0", features = ["async-spawn"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Opt out of the repository's root cargo workspace.
[workspace]

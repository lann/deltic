[package]
name = "guest-stream-pass"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async` is a default feature; it provides the guest-side task executor and
# stream/future support. No `async-spawn`: these exports never pump anything.
wit-bindgen = "=0.60.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Opt out of the repository's root cargo workspace.
[workspace]

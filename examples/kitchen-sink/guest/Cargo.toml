[package]
name = "example-kitchen-sink"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `async-spawn` backs the stream/future producer halves (countdown,
# deferred-answer): a write is a rendezvous, so it completes in a spawned
# background task while the reader half returns immediately.
wit-bindgen = { version = "=0.60.0", features = ["async-spawn"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Standalone: opt out of the repository's root cargo workspace so this
# directory can be copied out of the repo and built as-is.
[workspace]

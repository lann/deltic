name: Canary

# Weekly + on-demand only: SpiderMonkey nightly (`sm-nightly`), JSC trunk
# (`jsc-trunk`), and a Deno-canary probe run trunk-fresh engine builds
# against the conformance corpus (issue #22). These are FINDINGS lanes,
# never gates — every driver here exits 0 even with recorded deviations,
# per each lane's `required: false` overlay and the drivers' own exit
# policy (`tools/shell/run-lane.ts`, `tools/shell/deno-canary.ts`: exit 2
# is reserved for infrastructure failure, e.g. a missing shell binary or a
# channel unreachable). Nothing here feeds `ci.yml`'s release gate.
#
# The PINNED counterparts (`sm-pinned`, `jsc-pinned`; `required: true`) are
# NOT run here — they're per-push/PR REQUIRED gates in `ci.yml`'s `core`
# job now (this track's promotion), fetched from fixed, sha256-verified
# artifacts (tools/shell/pins.json) rather than the always-moving
# nightly/trunk channels this workflow tracks.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

env:
  DENO_VERSION: "2.9.5"
  WASM_TOOLS_VERSION: "1.247.0"
  JUST_VERSION: "1.54.0"

jobs:
  shell-canaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/component-model: testgen + conformance corpus
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }},just@${{ env.JUST_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Deliberately NO actions/cache for .shell-cache: trunk/nightly
      # builds change daily by design (fetching fresh IS the lane's
      # purpose), and a prefix-restored cache from a failed earlier run
      # can resurrect a broken extraction that fetch.ts's existence
      # check would then trust (bitten once: the first-run jsc layout
      # bug would have been pinned in place by exactly that).
      - run: just gha::canary

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-canaries-x64
          path: |
            sm-results.json
            jsc-results.json
            deno-canary-results.json
          if-no-files-found: warn

      - name: append summary
        if: always()
        run: |
          {
            echo "## Engine-shell canaries (x64)"
            echo
            echo "SpiderMonkey nightly, JSC trunk, Deno canary — findings lanes, non-gating."
            for f in sm-results.json jsc-results.json deno-canary-results.json; do
              if [ -f "$f" ]; then
                echo
                echo "### $f"
                echo '```json'
                python3 -c "import json,sys; d=json.load(open('$f')); print(json.dumps(d.get('header', d), indent=2)[:4000])" || cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # JSC has no arm64 build channel (jsc-built-products is x86_64-only) — this
  # leg runs the two lanes that DO have arm64 coverage (issue #22: "SM
  # nightlies publish aarch64 shells; JSC trunk and d8 do not").
  shell-canaries-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }},just@${{ env.JUST_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Deliberately NO actions/cache for .shell-cache: see the x64 job.
      - run: just gha::canary-arm

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-canaries-arm
          path: |
            sm-results.json
            deno-canary-results.json
          if-no-files-found: warn

      - name: append summary
        if: always()
        run: |
          {
            echo "## Engine-shell canaries (arm64)"
            echo
            echo "SpiderMonkey nightly + Deno canary (JSC trunk has no arm64 channel — skipped)."
            for f in sm-results.json deno-canary-results.json; do
              if [ -f "$f" ]; then
                echo
                echo "### $f"
                echo '```json'
                python3 -c "import json,sys; d=json.load(open('$f')); print(json.dumps(d.get('header', d), indent=2)[:4000])" || cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

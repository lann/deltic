name: Release

# Interim release scheme (issue #16): every release is a PRERELEASE; the tag
# is derived from the main commit short hash (`pre-<shorthash>`). Artifacts:
# the prebuilt translator wasm (standard release build — the exact artifact
# every test suite runs against — plus the size-tuned variant documented in
# crates/translator-shim/README.md) and SHA256SUMS, so consumers do not need
# a Rust toolchain.
#
# Invoked two ways: automatically from ci.yml's `release` job on every GREEN
# main ref update (workflow_call, gated on the same run's core+browser jobs),
# and manually (workflow_dispatch) as the escape hatch. The tag-exists guard
# makes re-runs no-ops-by-failure rather than duplicate releases.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  id-token: write # JSR OIDC publishing

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # commit count = the JSR prerelease number
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.54.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: compute tag
        id: tag
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAG="pre-$SHORT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: build the release artifacts
        # `just release-artifacts` (root justfile): the standard shim, the
        # size-tuned shim (flags per crates/translator-shim/README.md), the
        # embedder bundle (tools/release-bundle/entry.ts, gated by
        # bundle_test.ts in the core matrix), and SHA256SUMS.
        run: just release-artifacts

      - name: create prerelease
        run: |
          {
            echo "Prerelease \`${TAG}\` at ${GITHUB_SHA}."
            echo
            echo "Artifacts: the prebuilt translator shim wasm (size-tuned — the"
            echo "exact artifact every test suite runs against) and the embedder"
            echo "bundle deltic-embedder.mjs (one platform-neutral ES module:"
            echo "embedder API + Translator + ct-runner + wasi-shims — browsers"
            echo "and plain Node, no flags). Consumers need no Rust toolchain."
            echo "The same commit is published to JSR as an unstable prerelease"
            echo "of @deltic/{runtime,translator,wasi-shims,ct-runner}; see"
            echo "README.md for usage."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "deltic $TAG" \
            --notes-file notes.md \
            deltic-translator-shim.wasm \
            deltic-embedder.mjs SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: publish unstable prereleases to JSR
        # Version scheme (issue #16, interim): 0.1.0-pre.<main commit count>
        # — monotonic, derived from the ref being released, and unique per
        # commit (JSR refuses duplicate versions, which also makes re-runs
        # of this workflow no-ops-by-failure like the tag guard above).
        # The stamped versions are CI-working-tree-only (never committed);
        # cross-package workspace deps are rewritten by `deno publish`.
        # Auth: OIDC (permissions.id-token) — the @deltic packages must
        # exist on jsr.io and be linked to this repository (one-time
        # manual setup; see the #16 checklist).
        run: |
          COUNT=$(git rev-list --count HEAD)
          VERSION="0.1.0-pre.${COUNT}"
          echo "publishing @deltic/* ${VERSION}"
          for p in runtime translator wasi-shims ct-runner; do
            jq --arg v "$VERSION" '.version = $v' "$p/deno.json" > "$p/deno.json.tmp"
            mv "$p/deno.json.tmp" "$p/deno.json"
          done
          deno publish --allow-dirty

name: Release

# Interim release scheme (issue #16): every release is a PRERELEASE; the tag
# is derived from the main commit short hash (`pre-<shorthash>`). Artifacts:
# the prebuilt translator wasm (standard release build — the exact artifact
# every test suite runs against — plus the size-tuned variant documented in
# crates/translator-shim/README.md) and SHA256SUMS, so consumers do not need
# a Rust toolchain.
#
# Invoked two ways: automatically from ci.yml's `release` job on every GREEN
# main ref update (workflow_call, gated on the same run's core+browser jobs),
# and manually (workflow_dispatch) as the escape hatch. The tag-exists guard
# makes re-runs no-ops-by-failure rather than duplicate releases.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  id-token: write # JSR OIDC publishing

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.54.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: compute tag
        id: tag
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAG="pre-$SHORT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: build the release artifacts
        # `just release-artifacts` (root justfile): the standard shim, the
        # size-tuned shim (flags per crates/translator-shim/README.md), the
        # embedder bundle (tools/release-bundle/entry.ts, gated by
        # bundle_test.ts in the core matrix), and SHA256SUMS.
        run: just release-artifacts

      - name: publish unstable prereleases to JSR
        # Version scheme (issue #16, interim): 0.1.0-pre.g<shorthash> —
        # correlates 1:1 with this run's `pre-<shorthash>` release tag. The
        # `g` prefix (git-describe's convention) is load-bearing: a bare
        # short hash can be all-digits-with-leading-zero, which is INVALID
        # semver (numeric identifiers forbid leading zeros) and would fail
        # ~0.4% of publishes at random. Hash versions are unique per commit
        # (JSR refuses duplicates, making re-runs no-ops-by-failure like
        # the tag guard) but deliberately NOT monotonic under semver
        # ordering: unstable prereleases are pinned exactly, never ranged.
        # The stamped versions are CI-working-tree-only (never committed);
        # cross-package workspace deps are rewritten by `deno publish`.
        # Auth: OIDC (permissions.id-token) — the @deltic packages must
        # exist on jsr.io and be linked to this repository (one-time
        # manual setup; see the #16 checklist). The scope's "actor must be
        # a scope member" restriction is OFF: merges armed by the machine
        # account make the workflow actor `lannbot`, which broke the
        # publish (actorNotScopeMember) until the setting was disabled.
        # Runs BEFORE the GitHub release: it is the step most likely to
        # fail, and ordering it first keeps partial failures re-runnable —
        # a re-run passes the tag guard (no release yet) and `deno
        # publish` skips already-published versions, so it converges
        # instead of stranding a release that claims unpublished JSR
        # versions.
        run: |
          VERSION="0.1.0-pre.g${SHORT}"
          echo "publishing @deltic/* ${VERSION}"
          for p in runtime translator wasi ct-runner; do
            jq --arg v "$VERSION" '.version = $v' "$p/deno.json" > "$p/deno.json.tmp"
            mv "$p/deno.json.tmp" "$p/deno.json"
          done
          deno publish --allow-dirty
        env:
          SHORT: ${{ steps.tag.outputs.short }}

      - name: create prerelease
        run: |
          {
            echo "Prerelease \`${TAG}\` at ${GITHUB_SHA}."
            echo
            echo "Artifacts: the prebuilt translator shim wasm (size-tuned — the"
            echo "exact artifact every test suite runs against) and the embedder"
            echo "bundle deltic-embedder.mjs (one platform-neutral ES module:"
            echo "embedder API + Translator + ct-runner + the wasi package — browsers"
            echo "and plain Node, no flags). Consumers need no Rust toolchain."
            echo "The same commit is published to JSR as an unstable prerelease"
            echo "of @deltic/{runtime,translator,wasi,ct-runner}; see"
            echo "README.md for usage."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "deltic $TAG" \
            --notes-file notes.md \
            deltic-translator-shim.wasm \
            deltic-embedder.mjs SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
